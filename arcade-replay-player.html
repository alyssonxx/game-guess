<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Guess • Replay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030711;color:#eaf6ff;font-family:Inter,system-ui,sans-serif;overflow:hidden}#game{position:fixed;inset:0}#status{position:fixed;z-index:50;left:50%;top:14px;transform:translateX(-50%);max-width:min(92vw,720px);padding:10px 14px;border-radius:14px;background:rgba(3,7,17,.88);border:1px solid rgba(80,230,255,.25);backdrop-filter:blur(12px);text-align:center;font-weight:700}#hud{position:fixed;z-index:55;left:12px;bottom:12px;padding:9px 12px;border-radius:12px;background:rgba(3,7,17,.82);border:1px solid rgba(255,255,255,.12);font-size:12px}.actions{position:fixed;z-index:60;right:12px;top:12px;display:flex;gap:8px}.actions button{border:1px solid rgba(255,255,255,.18);background:rgba(8,14,28,.9);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.video-only{position:fixed;inset:0;display:none;place-items:center;padding:50px 12px}.video-only video{max-width:100%;max-height:84vh}.error{color:#ffb1bb}</style></head><body>
<div id="game"></div><div id="status">Preparando replay…</div><div id="hud" hidden></div><div class="actions"><button id="restart">↻ REINICIAR</button><button id="close">✕ FECHAR</button></div><div id="videoOnly" class="video-only"><video id="video" controls></video></div>
<script src="/firebase-config.js"></script><script type="module" src="/firebase.js?v=18.1.0"></script><script type="module" src="/arcade-replay-player.js?v=3.1.0"></script></body></html>
