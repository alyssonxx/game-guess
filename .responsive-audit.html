<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Auditoria local de layouts</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}select{position:fixed;right:6px;top:6px;z-index:10;max-width:180px}</style>
<select aria-label="Tela para inspecionar" id="screens"><option>Carregando</option></select>
<iframe src="/" title="Layout em teste"></iframe>
<script>
const frame=document.querySelector('iframe'),select=document.querySelector('select');
frame.onload=()=>{
 const doc=frame.contentDocument;
 const views=[...doc.querySelectorAll('.screen,.overlay')];
 select.replaceChildren(...views.map(el=>new Option(el.id,el.id)));
 function show(){
  doc.querySelectorAll('.screen,.overlay').forEach(el=>{el.classList.remove('active');if(el.classList.contains('overlay'))el.setAttribute('aria-hidden','true')});
  const chosen=doc.getElementById(select.value);chosen.classList.add('active');chosen.setAttribute('aria-hidden','false');
  frame.contentWindow.scrollTo(0,0);
 }
 select.onchange=show;show();
};
</script></html>
