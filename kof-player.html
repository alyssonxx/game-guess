<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050913">
  <style>
    html,body,#game{width:100%;height:100%;margin:0;background:#050913;color:#fff;font-family:Arial,sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 25%,#17254a 0,#090f20 42%,#050913 76%);z-index:20}
    #boot .panel{max-width:620px}
    #boot b{font-size:1.15rem}
    #boot small{display:block;color:#9ca9c3;margin:10px auto 18px;max-width:580px;line-height:1.5}
    #startKofButton{border:1px solid #42e8ff;background:linear-gradient(135deg,#26d8f2,#518bff);color:#04111c;font-weight:900;letter-spacing:.06em;padding:13px 24px;border-radius:12px;cursor:pointer;box-shadow:0 10px 35px rgba(66,232,255,.18)}
    #startKofButton:disabled{opacity:.6;cursor:wait}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="panel"><b>🥊 KOF 2002 Magic Plus II</b><small id="bootText">Preparando EmulatorJS 4.2.1 + FBNeo + romset Full Non-Merged.</small><button id="startKofButton" type="button">INICIAR KOF</button></div></div>
  <script src="/kof-player.js?v=17.9.0"></script>
</body>
</html>
